<!doctype html><html><head><meta charset="utf-8"><title>Karthik Map — offline</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0a84ff,#5e5ce6 55%,#ff375f);color:#1d1d1f}main{width:min(460px,90vw);padding:30px;border-radius:26px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}@media(prefers-color-scheme:dark){main{background:rgba(30,30,34,.8);color:#f5f5f7}input{background:#2a2a2e;color:#fff}}h1{margin:0 0 6px;font-size:24px}p{margin:8px 0 16px;line-height:1.5;opacity:.8;font-size:14px}input{width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid rgba(120,120,128,.35);border-radius:14px;font-size:15px}button{margin-top:12px;padding:12px 22px;border:0;border-radius:99px;background:#0a84ff;color:#fff;font-size:15px;font-weight:600;cursor:pointer}.err{color:#ff453a;margin:8px 0 0;min-height:1.2em;font-size:13px}</style></head><body><main>
